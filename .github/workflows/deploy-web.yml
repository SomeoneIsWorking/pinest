# Auto-deploy the Flutter web client to Firebase Hosting on every push to main.
#
# One-time setup (repo admin): add a Firebase service account JSON with the
# "Firebase Hosting Admin" role as the repository secret FIREBASE_SERVICE_ACCOUNT
# (Firebase console → Project settings → Service accounts → Generate new private key).
#
# app/README.md documents this as "push to main auto-deploys" — this workflow
# is what makes that claim true.
name: Deploy web client

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: github.repository == 'SomeoneIsWorking/pinest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
        working-directory: app

      - run: flutter analyze --no-pub
        working-directory: app

      - run: flutter test
        working-directory: app

      - run: flutter build web --release
        working-directory: app

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: pinest-app
          channelId: live
          entryPoint: app
